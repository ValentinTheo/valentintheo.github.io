    - "Center for Business Taxation Doctoral Conference (Oxford, 2025)"
    - "UC Santa Barbara Brown Bag Seminar (Santa Barbara, 2025)"
    - "University of Utah Lunch Seminar (Salt Lake City, 2025)"
